services:
  api:
    build:
      context: ./services/api
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/micro_action_coach.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  api-data:
